name: Budget Direct
kind: company
description: >-
  Budget Direct is one of Australia's largest direct-to-consumer general insurance brands, operated
  from Toowong, Queensland by Auto & General Services Pty Ltd (ABN 61 003 617 909) with general
  insurance products issued by Auto & General Insurance Company Limited (ABN 42 111 586 353), an
  APRA-authorised insurer. The brand sells car, home and contents, motorcycle, travel, pet and life
  insurance plus roadside assistance direct to Australian consumers online and by phone, with life
  cover underwritten by NobleOak Life Limited and travel cover by Zurich Australian Insurance
  Limited. Its parent, Auto & General, also white-labels personal lines through distribution partners
  including Qantas, Coles Insurance, ING and Oceania Insurance. Budget Direct publishes NO public
  self-serve developer portal and NO public API. Every candidate developer host was probed on
  2026-07-25 — developer., developers., docs., api., partners., portal., broker., sandbox. and
  apis.budgetdirect.com.au all fail DNS resolution, and /developers, /developer, /api, /partners and
  /integrations all return HTTP 404 — while the full 738-URL sitemap contains no developer, API or
  integration page. Quote, bind, issue and claim (FNOL) exist only as consumer web journeys and a
  logged-in existing-customer self-service area; there is no documented machine surface for any of
  them. The parent domain does carry an Apigee gateway hostname (api.autogeneral.com.au, CNAME to
  autogeneral-prod.apigee.net, preconnect-hinted by the consumer site) but it is first-party and
  undocumented, with no developer portal, no OpenAPI, no ACORD/AL3 reference anywhere on either
  site, and partner integration handled as private commercial arrangements through Auto & General.
  This record is an honest stub: an APRA-regulated Australian carrier with no public API surface.
