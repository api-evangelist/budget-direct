actions:
  apisListed: 0
  openapiDirectoryCreated: false
  status: built-stub
  reason: >-
    Identity captured accurately with an empty apis[] block. There is no public self-serve API,
    no developer portal and no harvestable specification. Recording that absence precisely — for
    an APRA-regulated Australian carrier in a market where the CDR insurance designation was
    deferred — is the correct and intended outcome for this data set.
